<!--Header-->
{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BytePress</title>
    <link
      href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900"
      rel="stylesheet"
    />
    <link href="{% static 'css/blog.css' %}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row justify-content-between align-items-center">
          <div class="col-12 col-md-4 pt-1 text-center text-md-left">
            <a class="blog-header-logo text-dark" href="/">BytePress</a>
          </div>
          <div class="col-12 col-md-4 my-3 my-md-0">
            <form action="{% url 'search' %}" method="GET" role="search">
              <label class="sr-only" for="header-search">Search posts</label>
              <div class="input-group">
                <input class="form-control" type="search" id="header-search" name="q"
                       placeholder="Search posts..." value="{{ request.GET.q }}" required />
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" type="submit">Search</button>
                </div>
              </div>
            </form>
          </div>
          <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-end align-items-center">
            <a class="btn btn-sm btn-warning" href="#">Sign in</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">Register</a>
          </div>
        </div>
      </header>

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for category in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_category' category.id %}">{{category}}</a>
          {% endfor %}
        </nav>
      </div>
<!--Main-->
{% block content %}

{% endblock %}
<!--Footer-->

 <footer class="blog-footer">
      <p>BytePress built with � with <a href="#">Django</a></p>
    </footer>

      </body>
</html>
